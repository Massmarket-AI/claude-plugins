# Gitleaks: the default rules, plus ONE allowlisted value.
#
# mm-hooks carries the published time tracker extension (plugins/mm-hooks/extension/), and its manifest.json
# holds the extension's `key`: the PUBLIC half of the key pair that pins the extension id
# lcnfnlckdnnmgijlfmedfikafaogenga. Chrome derives the id from it, and every member's install depends on it
# staying byte for byte the same. generic-api-key reads it as a credential. It is not one: it is in every
# copy of the extension anyone has downloaded. Only a line holding this exact key is allowed; every other
# finding still fails the scan, here, in CI and in scripts/release.mjs.
[extend]
useDefault = true

[[allowlists]]
description = "The time tracker extension's public manifest key (pins its id; public, not a secret)"
regexTarget = "line"
regexes = ['''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAjST3RY9\+5\+HmZ\+cszeP2CJM0k350CSXHEYrnGkOUASUbxSaJsjjdugOxPoVzUdyjYiX3MuqtCA8idD\+l5Jx\+DhnPMOCI8Zr7eKcA1YD7auBTIP9qgBTp144DBjIy3LLkfiz5iGOPc2z9\+uZOOiOWR8Yu8gSl9EPzZNgiCrx8d/w5fX9tdykbLMYR8dc1Obbs5YiSw0Ls72oytHYFMf3UuUyUzf/NHB\+oF6UUA7KxOx3/mq4Q7SOaHrDYLMUNVS\+4o2Em13ehlWiLvd0JvqHJA1FCw5aR9fKYqMDN1W3ismPUfSwkNq3N8Ckcp4wVHBJav9qOuXac\+2nHcUE/uGpiTQIDAQAB''']
